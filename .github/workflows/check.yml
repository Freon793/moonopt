name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      # Full history on purpose: the last step asks git whether a report's own source
      # paths changed between the commit it recorded and HEAD, and a shallow clone
      # cannot answer that (the recorded commit is not there).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The toolchain is NOT pinned, and that is a measured fact rather than a preference.
      #
      # `moonbit-community/setup-moonbit` accepts only the keywords latest, nightly,
      # pre-release, stable and bleeding in its `version` input; `normalizeVersion` throws
      # `unsupported version: <input>` for anything else. Run 43 of this workflow handed it
      # "0.1.20260904" and all five jobs died in the install step (see CHANGELOG.md).
      # Installing a pinned toolchain by hand instead is not available either: on
      # 2026-09-21 every versioned key on cli.moonbitlang.com answered 403 AccessDenied -
      # ten version strings probed across binaries/ and cores/, as .tar.gz, .zip and
      # .sha256 - while `latest`, `nightly` and `pre-release` answer 200 and a Range
      # request on `latest` answers 206, so the 403 is the CDN's policy and not a probe
      # artefact. There is no downloadable pinned artefact to be deterministic against.
      #
      # What replaces pinning, then, is three things. (1) This repository has to be clean
      # on the current `latest`, checked locally against the released toolchain before a
      # push, so a compiler release is answered in the round that meets it instead of by
      # five red jobs. (2) The toolchain each run actually used is written into the run's
      # annotations - a job log needs credentials to read, an annotation does not, and an
      # unpinned toolchain that is not recorded leaves a verdict nobody can attribute.
      # (3) The benchmark reports say which toolchain produced them, since a report is only
      # evidence about the thing that CI runs if the two are the same compiler.
      - name: install
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100

      # Emitted as a notice on purpose: the annotation is readable from the run page
      # without credentials, the step's own output is not.
      - name: moon version
        shell: bash
        run: |
          moon version --all
          version=$(moon version --all 2>&1 | tr '\n' ' ')
          printf '%s\n' "$version" | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
            echo "::notice title=toolchain::${line}"
          done

      - name: moon update
        run: moon update

      # The failing step has to say what it saw: a job log is only readable with
      # credentials, while a workflow command lands in the run's annotations, which anyone
      # can read through the page. `--deny-warn` stops the build at the first package that
      # has a warning, so the strict output is one package's worth of them; the same check
      # *without* `--deny-warn` compiles everything (a warning does not stop a build) and
      # prints the whole list, which is what answering a compiler release needs. Both are
      # emitted, and the step still exits non-zero, so the verdict stays as strict as it was.
      - name: moon check
        shell: bash
        run: |
          set +e
          version=$(moon version --all 2>&1 | tr '\n' ' ')
          output=$(moon check --deny-warn 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            escape() { sed -e 's/%/%25/g' -e 's/\r//g'; }
            echo "::error title=moon version::$(printf '%s' "$version" | escape)"
            printf '%s\n' "$output" | grep -n -i -E 'warning|error|[0-9]{4}' | head -n 20 | escape | while IFS= read -r line; do
              echo "::error title=moon check (strict)::${line}"
            done
            full=$(moon check 2>&1)
            printf '%s\n' "$full" | grep -i -E 'warning|error|implicit|unqualified|deprecated' | sed -e 's/^[[:space:]]*//' -e 's/%/%25/g' | sort -u | head -n 60 | while IFS= read -r line; do
              echo "::error title=moon check (all warnings)::${line}"
            done
            echo "::error title=moon check exit::moon check --deny-warn exited ${code}"
          fi
          exit $code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: info check
        run: |
          moon info
          git diff --exit-code

      - name: moon test
        shell: bash
        run: |
          set +e
          output=$(moon test --deny-warn 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            printf '%s\n' "$output" | grep -n -i -E 'warning|error|failed|[0-9]{4}' | head -n 20 | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
              echo "::error title=moon test::${line}"
            done
            echo "::error title=moon test exit::moon test --deny-warn exited ${code}"
          fi
          exit $code

      # A report under bench/ is evidence, and evidence that describes older code is
      # worse than none. bench/report.ps1 answers "is this report still current" from
      # the commit each report recorded for itself; this step makes the answer visible
      # where it can be acted on.
      #
      # It reads the index the script writes rather than its console output: the script
      # prints its summary with Write-Host, which does not travel down the pipeline, so
      # capturing it and matching the text there silently reads nothing. It matches the
      # table cell `STALE (`, not the word STALE: the index explains what STALE means in
      # prose, and a search for the bare word matches that explanation on a healthy tree.
      # Both of those were found by running these exact steps locally before trusting them.
      - name: benchmark reports are current
        shell: pwsh
        run: |
          $index = Join-Path $env:RUNNER_TEMP "report-index.md"
          & ./bench/report.ps1 -Output $index
          if ($LASTEXITCODE -ne 0) {
            throw "bench/report.ps1 exited $LASTEXITCODE, so the staleness question was not answered"
          }
          if (-not (Test-Path $index)) {
            throw "bench/report.ps1 wrote no index, so this check has nothing to read"
          }
          $stale = @(Select-String -Path $index -Pattern 'STALE \(')
          if ($stale.Count -ne 0) {
            $stale | ForEach-Object { $_.Line }
            throw "a report under bench/ no longer describes the code in the tree; regenerate it in the round that made it stale"
          }

  targets:
    name: test target (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js]
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      # Unpinned for the reason recorded in the `check` job: the action rejects a version
      # string and the CDN serves no versioned artefact, so `latest` is what runs here.
      - name: install
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100

      - name: moon version
        shell: bash
        run: |
          moon version --all
          version=$(moon version --all 2>&1 | tr '\n' ' ')
          printf '%s\n' "$version" | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
            echo "::notice title=toolchain::${line}"
          done

      - name: moon update
        run: moon update

      - name: moon test (${{ matrix.target }})
        shell: bash
        run: |
          set +e
          output=$(moon test --target ${{ matrix.target }} --deny-warn 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            escape() { sed -e 's/%/%25/g' -e 's/\r//g'; }
            echo "::error title=toolchain::$(moon version --all 2>&1 | tr '\n' ' ' | escape)"
            printf '%s\n' "$output" | grep -n -i -E 'warning|error|failed|[0-9]{4}' | head -n 20 | escape | while IFS= read -r line; do
              echo "::error title=moon test (${{ matrix.target }}) (strict)::${line}"
            done
            full=$(moon test --target ${{ matrix.target }} 2>&1)
            printf '%s\n' "$full" | grep -i -E 'warning|error|implicit|unqualified|deprecated' | sed -e 's/^[[:space:]]*//' -e 's/%/%25/g' | sort -u | head -n 60 | while IFS= read -r line; do
              echo "::error title=moon test (${{ matrix.target }}) (all warnings)::${line}"
            done
            echo "::error title=moon test exit::moon test --target ${{ matrix.target }} --deny-warn exited ${code}"
          fi
          exit $code
